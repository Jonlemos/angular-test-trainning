<div class="react-wrapper-container bg-[#f5f5f5] min-h-screen">
  <!-- Estado de Carregamento -->
  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="spinner"></div>
      <p class="loading-text">Carregando Itaú Empresas...</p>
    </div>
  }

  <!-- Container onde o React será montado -->
  <div #reactContainer class="w-full h-full"></div>

  <!-- Estado de Erro -->
  @if (errorMessage()) {
    <div class="error-overlay p-6">
      <div class="error-card bg-white p-6 rounded-xl border border-red-200 shadow-sm">
        <h2 class="text-xl font-bold text-red-600 mb-2">Erro ao carregar módulo</h2>
        <p class="text-slate-600 mb-4">{{ errorMessage() }}</p>
        <button (click)="retry()" class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 transition-colors">
          Tentar novamente
        </button>
      </div>
    </div>
  }
</div>
